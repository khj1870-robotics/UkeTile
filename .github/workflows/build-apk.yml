name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/uketile-ukulele-app-nsbw3r
    paths:
      - 'src/**'
      - 'assets/**'
      - 'plugins/**'
      - 'credentials/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean

      # Sideloaded test APK for real-device testing (not a Play Store release),
      # so we skip the other 3 ABIs — building only arm64-v8a (virtually all
      # modern Android phones) roughly quarters native compile time.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uketile-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
